name: AI Bug Fix
on:
  workflow_dispatch:
    inputs:
      summary:
        description: Short summary for commit and PR title
        required: true
      description:
        description: What's the bug? Describe it plainly.
        required: true
      channel_id:
        description: Channel ID of Slack from which the bug is reported.
        required: true
      issue_key:
        description: Issue Key of Jira Ticket.
        required: true
      message_ts:
        description: Timestamp of creation of parent message.
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # -----------------------------
      # Checkout repo
      # -----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Setup Python
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # -----------------------------
      # Install Aider
      # -----------------------------
      - name: Install Aider
        run: pip install aider-chat

      # -----------------------------
      # Install project dependencies
      # -----------------------------
      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . 2>/dev/null || true; fi
          if [ -f setup.py ]; then pip install -e . 2>/dev/null || true; fi

      # -----------------------------
      # Debug API key
      # -----------------------------
      - name: Debug API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "❌ OPENAI_API_KEY is NOT set"
            exit 1
          else
            echo "✅ OPENAI_API_KEY is set"
          fi

      # -----------------------------
      # Run Aider
      # -----------------------------
      - name: Run Aider
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Record the current HEAD so we can diff only Aider's file changes later
          git rev-parse HEAD > /tmp/pre_aider_sha

          aider \
            --yes \
            --model gpt-4o \
            --no-gitignore \
            --no-auto-commits \
            --map-tokens 4096 \
            --message "${{ inputs.description }}

            Instructions:
            - Read the repo map and find the relevant files yourself.
            - Make the minimal, targeted change needed.
            - Do not refactor unrelated code.
            - Do not create new files unless necessary.
            "

      # -----------------------------
      # Commit changes (ignore aider files)
      # -----------------------------
      - name: Commit changes
        run: |
          git config user.name  "ai-bot"
          git config user.email "ai@bot.com"

          # Stage all changes except .aider* files
          git add .
          git diff --cached --name-only | grep '^\\.aider' | xargs git reset HEAD -- 2>/dev/null || true

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "⚠️ No changes to commit."
          else
            git commit -m "fix: ${{ inputs.summary }}"
          fi

      # -----------------------------
      # Debug git state
      # -----------------------------
      - name: Debug git status
        run: |
          git status
          git log --oneline -n 3

      # -----------------------------
      # Create Pull Request
      # -----------------------------
      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix: ${{ inputs.summary }}"
          branch: ai-fix/run-${{ github.run_number }}
          base: main
          title: "fix: ${{ inputs.summary }}"
          draft: true
          labels: ai-generated
          body: |
            **Task Details:**
            ${{ inputs.description }}

            **Changes:**
            Automated fix generated using Aider (GPT-4o)

            ⚠️ Please review carefully before merging.
            
      # -----------------------------
      # Notify Webhook
      # -----------------------------
      - name: Send webhook notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ WEBHOOK_URL is not set"
            exit 0
          fi

          STATUS="${{ job.status }}"
          PR_URL=$(git config --get remote.origin.url | sed 's/.git$//')/pulls

          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"$STATUS\",
              \"summary\": \"${{ inputs.summary }}\",
              \"description\": \"${{ inputs.description }}\",
              \"repo\": \"${{ github.repository }}\",
              \"run_id\": \"${{ github.run_id }}\",
              \"pr_url\": \"${{ steps.cpr.outputs.pull-request-url }}\",
              \"channel_id\": \"${{ inputs.channel_id }}\",
              \"issue_key\": \"${{ inputs.issue_key }}\",
              \"message_ts\": \"${{ inputs.message_ts }}\",
            }"
