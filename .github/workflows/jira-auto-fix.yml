name: AI Bug Fix

on:
  workflow_dispatch:
    inputs:
      summary:
        description: Short summary for commit and PR title
        required: true
      description:
        description: What's the bug? Describe it plainly.
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # -----------------------------
      # Checkout repo
      # -----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Setup Python
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # -----------------------------
      # Install Aider
      # -----------------------------
      - name: Install Aider
        run: pip install aider-chat

      # -----------------------------
      # Install project dependencies
      # -----------------------------
      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . 2>/dev/null || true; fi
          if [ -f setup.py ]; then pip install -e . 2>/dev/null || true; fi

      # -----------------------------
      # Debug API key
      # -----------------------------
      - name: Debug API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "❌ OPENAI_API_KEY is NOT set"
            exit 1
          else
            echo "✅ OPENAI_API_KEY is set"
          fi

      # -----------------------------
      # Run Aider
      # -----------------------------
      - name: Run Aider
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          aider \
            --yes \
            --model gpt-4o \
            --no-gitignore \
            --map-tokens 4096 \
            --message "
            ${{ inputs.description }}
            
            Instructions:
            - Read the repo map and find the relevant files yourself.
            - Make the minimal, targeted change needed.
            - Do not refactor unrelated code.
            - Do not create new files unless necessary.
            "

      # -----------------------------
      # Commit changes (ignore aider files)
      # -----------------------------
      - name: Commit changes
        run: |
          git config user.name  "ai-bot"
          git config user.email "ai@bot.com"

          # Exclude aider files
          git add . ':!*.aider*' ':!.aider*'

          if git diff --cached --quiet; then
            echo "NO_CHANGES=true" >> $GITHUB_ENV
            echo "⚠️ Aider made no changes."
          else
            echo "NO_CHANGES=false" >> $GITHUB_ENV
            CHANGED=$(git diff --cached --name-only | tr '\n' ' ')
            echo "✅ Changed: $CHANGED"
            git commit -m "fix: ${{ inputs.summary }}"
          fi

      # -----------------------------
      # Debug git state
      # -----------------------------
      - name: Debug git status
        if: env.NO_CHANGES != 'true'
        run: |
          git status
          git log --oneline -n 3

      # -----------------------------
      # Create Pull Request
      # -----------------------------
      - name: Create pull request
        if: env.NO_CHANGES != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix: ${{ inputs.summary }}"
          branch: ai-fix/run-${{ github.run_number }}
          base: main
          title: "fix: ${{ inputs.summary }}"
          draft: true
          labels: ai-generated
          body: |
            **Task Details:**
            ${{ inputs.description }}

            **Changes:**
            Automated fix generated using Aider (GPT-4o)

            ⚠️ Please review carefully before merging.
