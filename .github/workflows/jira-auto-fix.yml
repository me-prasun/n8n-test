name: Jira Auto Fix

on:
  workflow_dispatch:
    inputs:
      jira_key:
        required: true
      jira_summary:
        required: true
      jira_description:
        required: true
      jira_url:
        required: true

jobs:
  fix-bug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python (for Aider)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          pip install aider-chat

      - name: Create branch
        run: |
          BRANCH="bugfix/${{ inputs.jira_key }}"
          git checkout -b $BRANCH

      - name: Run Aider to update README
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          aider README.md \
            --yes \
            --model gpt-4o \
            --no-gitignore \
            --message "
            Update the README based on this Jira issue:
      
            Jira: ${{ inputs.jira_key }}
            Summary: ${{ inputs.jira_summary }}
            Description: ${{ inputs.jira_description }}
      
            Requirements:
            - Improve or update README content
            - Keep formatting clean (Markdown)
            - Do not create new files
            "

      - name: Commit changes (if any)
        run: |
          git config user.name "ai-bot"
          git config user.email "ai@bot.com"
          git add .
          git commit -m "docs(${{ inputs.jira_key }}): update README" || echo "No changes"

      - name: Push branch
        run: |
          git push origin HEAD

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          title: "[${{ inputs.jira_key }}] Update README"
          body: |
            Auto-generated README update for ${{ inputs.jira_key }}

            Jira: ${{ inputs.jira_url }}
          branch: bugfix/${{ inputs.jira_key }}
